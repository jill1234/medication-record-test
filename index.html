function pdfTextLines(selection){

function wrapPdfLine(ctx,line,maxWidth){
 if(!line)return [''];
 const result=[];let current='';
 for(const ch of String(line)){
  if(current&&ctx.measureText(current+ch).width>maxWidth){result.push(current);current=ch}
  else current+=ch;
 }
 if(current)result.push(current);
 return result;
}
async function makeHistoryPdf(selection,customLines){
 const W=1240,H=1754,margin=90,top=110,bottom=100,lineHeight=47;
 const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
 const ctx=canvas.getContext('2d');if(!ctx)throw Error('此裝置無法使用 PDF 繪圖功能。');

 const lines=(customLines||pdfTextLines(selection)).flatMap(s=>wrapPdfLine(ctx,s,W-margin*2));
 const maxLines=Math.floor((H-top-bottom)/lineHeight),pages=[];
 for(let i=0;i<lines.length;i+=maxLines){
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#304234';ctx.font='29px -apple-system, "Noto Sans TC", sans-serif';
  const pageLines=lines.slice(i,i+maxLines);
  pageLines.forEach((s,j)=>ctx.fillText(s,margin,top+j*lineHeight));
  ctx.font='21px -apple-system, "Noto Sans TC", sans-serif';ctx.fillStyle='#798476';
  ctx.fillText('藥物使用紀錄 · 第 '+(pages.length+1)+' 頁',margin,H-52);
  const data=canvas.toDataURL('image/jpeg',0.82).split(',')[1];
  const binary=atob(data),bytes=new Uint8Array(binary.length);
  for(let k=0;k<binary.length;k++)bytes[k]=binary.charCodeAt(k);
  pages.push(bytes);
 }
 const enc=new TextEncoder(),chunks=[],offsets=[0];let pos=0;
 const push=bytes=>{chunks.push(bytes);pos+=bytes.length};
 const ascii=s=>push(enc.encode(s));
 const obj=(id,body)=>{offsets[id]=pos;ascii(id+' 0 obj\n'+body+'\nendobj\n')};
 ascii('%PDF-1.4\n');
 const n=pages.length;
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+n+' >>');
 pages.forEach((bytes,i)=>{
  const pageId=3+i*3,imgId=pageId+1,contentId=pageId+2;
  obj(pageId,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+imgId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
  offsets[imgId]=pos;
  ascii(imgId+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');
  push(bytes);ascii('\nendstream\nendobj\n');
  const stream='q\n595 0 0 842 0 0 cm\n/Im0 Do\nQ\n';
  obj(contentId,'<< /Length '+enc.encode(stream).length+' >>\nstream\n'+stream+'endstream');
 });
 const xref=pos;
 ascii('xref\n0 '+(3+n*3)+'\n0000000000 65535 f \n');
 for(let i=1;i<3+n*3;i++)ascii(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 ascii('trailer\n<< /Size '+(3+n*3)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 return new Blob(chunks,{type:'application/pdf'});
}

 <div><label>庫存／服用單位</label><input name="unit" value="${safe(m.unit)}"></div>
 <div><label>每次服用量</label><input type="number" step="any" min="0.001" name="dose" value="${m.dose}"></div>
 <div><label>每日預計使用量</label><input type="number" step="any" min="0" name="daily" value="${m.daily}"></div>
 <div class="full"><label>固定服藥時間（多個以半形逗號分隔，例如 08:00,20:00）</label><input name="times" value="${safe(m.times||'')}"></div>
 <div><label>目前庫存</label><input type="number" min="0" step="any" name="stock" value="${m.stock}"></div>
 <div><label>庫存提醒數量</label><input type="number" min="0" name="threshold" value="${m.threshold}"></div>
 <div><label>剩餘天數提醒（0 表示停用）</label><input type="number" min="0" name="days" value="${m.days}"></div>
 <div class="full" style="border-top:1px solid #e6e8df;margin-top:8px;padding-top:8px"><strong>選填資料</strong></div>
 <div class="full"><label>用途及備註（選填）</label><textarea name="info">${safe(m.info)}</textarea></div>
 <div class="full"><label>有效期限（選填）</label><input name="expiry" type="date" value="${safe(m.expiry||'')}"></div>
 <div class="full"><label>取得日期（選填）</label><input name="acquired" type="date" value="${safe(m.acquired||'')}"></div>
 <div class="full"><label>藥品許可證字號（選填）</label><input name="license" value="${safe(m.license||'')}"></div>
 <div class="full"><label>資料來源網址（選填）</label><input name="source" type="url" placeholder="https://..." value="${safe(m.source||'')}"></div>
 <div><label>預設購買單位</label><input name="buyUnit" value="${safe(m.buyUnit||'盒')}"></div>
 <div><label>預設購買數量</label><input name="buyQty" type="number" step="any" min="0.001" value="${m.buyQty||1}"></div>
 <div><label>每包裝含量（選填）</label><input name="packSize" type="number" step="any" min="0" value="${m.packSize||''}"></div>
 <div class="full"><label>搜尋藥物圖片</label><div class="row"><input id="lookupTerm" placeholder="輸入藥物名稱或外觀特徵" value="${safe(m.name)}"><button type="button" class="secondary" onclick="lookupMedicine()">搜尋圖片</button></div><div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start"><button type="button" class="secondary" onclick="lookupTaiwanMedicine()">搜尋台灣藥品資料</button></div><p class="muted">圖片與台灣藥品資料搜尋會在新分頁開啟；「搜尋台灣藥品資料」使用一般網頁搜尋查找台灣藥品資料，並非 App 直接讀取官方資料庫。請以藥袋、許可證字號、劑型及含量核對。若要儲存照片，請使用下方「藥物照片」上傳自己拍攝或有權使用的圖片。</p></div>
 <div class="full"><label>藥物照片（選填）</label><input type="file" id="photoInput" accept="image/*"><p class="muted">新上傳的照片會自動縮小並壓縮；既有照片保持不變。</p></div>
 </div><div class="row"><button type="submit">儲存藥物</button>${id?`<button type="button" class="danger" onclick="deleteMed('${id}')">刪除藥物</button>`:''}<button type="button" class="secondary" onclick="render()">取消</button></div></form>`;
 $('medform').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let v={id:id||crypto.randomUUID(),person:person(),name:f.get('name').trim(),info:f.get('info'),expiry:f.get('expiry')||'',acquired:f.get('acquired')||'',license:f.get('license'),source:f.get('source').trim(),type:f.get('type'),unit:f.get('unit')||'顆',buyUnit:f.get('buyUnit')||'盒',buyQty:Number(f.get('buyQty'))||1,packSize:Number(f.get('packSize'))||0,active:f.get('active')!=='false',dose:Number(f.get('dose')),daily:Number(f.get('daily')),times:f.get('times'),stock:Number(f.get('stock')),threshold:Number(f.get('threshold')),days:Number(f.get('days')),photo:m.photo};if(!Number.isFinite(v.dose)||v.dose<=0||!Number.isFinite(v.daily)||v.daily<0||!Number.isFinite(v.stock)||v.stock<0||!Number.isSafeInteger(v.threshold)||v.threshold<0||!Number.isSafeInteger(v.days)||v.days<0){alert('請輸入有效數值；服用量可以是整數或小數，提醒天數須為整數。');return;}let file=$('photoInput').files[0];if(file){try{v.photo=await compressMedicinePhoto(file)}catch(err){alert('照片處理失敗：'+err.message);return}}if(id)db.meds[db.meds.findIndex(x=>x.id===id)]=v;else db.meds.push(v);save()}
}
function lookupMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?tbm=isch&q='+encodeURIComponent(q+' 藥物 外觀'),'_blank','noopener,noreferrer')}
function lookupTaiwanMedicine(){let q=$('lookupTerm').value.trim();if(!q)return alert('請輸入藥物名稱。');window.open('https://www.google.com/search?q='+encodeURIComponent(q+' 台灣 藥品 資料 許可證'),'_blank','noopener,noreferrer')}

function exportData(){const data=storageRecoveryMode?rawAtStartup:JSON.stringify({format:'medication-journal',version:5,families:db.families,restocks:db.restocks,reminders:db.reminders,reminderTimes:db.reminderTimes,allergies:db.allergies,unopenedStocks:db.unopenedStocks,purchaseNotes:db.purchaseNotes,purchasePrices:db.purchasePrices,exportedAt:new Date().toISOString(),meds:db.meds,logs:db.logs},null,2);const url=URL.createObjectURL(new Blob([data||''],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=storageRecoveryMode?'藥物使用紀錄_原始資料復原檔.json':'藥物使用紀錄_備份_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function importData(event){const file=event.target.files?.[0];if(!file)return;try{if(file.size>12*1024*1024)throw Error('備份檔過大');const v=JSON.parse(await file.text());if(v.format!=='medication-journal'||!Array.isArray(v.meds)||!Array.isArray(v.logs))throw Error('備份格式不正確');if(v.meds.some(m=>typeof m.id!=='string'||typeof m.person!=='string'||typeof m.name!=='string'||!Number.isFinite(m.stock))||v.logs.some(l=>typeof l.id!=='string'||typeof l.medId!=='string'||!Number.isFinite(l.qty)))throw Error('備份資料格式不正確');if(!confirm('還原將覆蓋目前所有藥物與服藥紀錄。確定繼續？'))return;const old=db,oldRecoveryMode=storageRecoveryMode;db={meds:v.meds,logs:v.logs,families:Array.isArray(v.families)?v.families:[...new Set(v.meds.map(m=>m.person).filter(x=>x!=='自己'))],restocks:Array.isArray(v.restocks)?v.restocks:[],reminders:v.reminders&&typeof v.reminders==='object'&&!Array.isArray(v.reminders)?v.reminders:{},reminderTimes:v.reminderTimes&&typeof v.reminderTimes==='object'&&!Array.isArray(v.reminderTimes)?v.reminderTimes:{},allergies:Array.isArray(v.allergies)?v.allergies:[],unopenedStocks:Array.isArray(v.unopenedStocks)?v.unopenedStocks:[],purchaseNotes:v.purchaseNotes&&typeof v.purchaseNotes==='object'&&!Array.isArray(v.purchaseNotes)?v.purchaseNotes:{},purchasePrices:v.purchasePrices&&typeof v.purchasePrices==='object'&&!Array.isArray(v.purchasePrices)?v.purchasePrices:{}};storageRecoveryMode=false;refreshPeople();try{localStorage.setItem(KEY,JSON.stringify(db));render();alert('備份還原完成。')}catch(e){db=old;storageRecoveryMode=oldRecoveryMode;alert('儲存失敗，原資料未變更。')}}catch(e){alert('無法還原：'+e.message)}finally{event.target.value=''}}
function deleteMed(id){if(confirm('刪除此藥物？過去的服藥紀錄也會刪除。')){const m=db.meds.find(x=>x.id===id);if(m)delete db.purchasePrices[priceKey(m)];db.meds=db.meds.filter(m=>m.id!==id);db.logs=db.logs.filter(l=>l.medId!==id);save()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(tab==='stock'&&b.dataset.tab!=='stock'&&!stockExit())return;historyExportApproval=null;tab=b.dataset.tab;render()});$('person').onchange=()=>{if(tab==='stock'&&!stockExit()){$('person').value=lastPerson;return;}lastPerson=person();historyExportApproval=null;render()};refreshPeople();lastPerson=person();
if(storageRecoveryMode){$('content').innerHTML='<div class="card"><h2>資料保護模式</h2><p>系統無法安全讀取原有資料，因此已停止儲存，避免覆蓋資料。請不要清除網站資料或移除 App。若你有先前 JSON 備份，請使用下方「還原備份」；原始資料仍保留在此網站儲存空間中。</p></div>';}
else render();
</script></body></html>
